[project]
name = "facebook-mcp"
dynamic = ["version"]
description = "MCP server that lets AI assistants (Claude, ChatGPT, Gemini, Cursor, ...) manage Facebook Pages through the Graph API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Salinda Hulangamuwa" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "fastmcp", "facebook", "meta", "graph-api", "ai", "llm", "claude", "chatgpt", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
Homepage = "https://github.com/SalindaHulangamuwa/facebook-mcp"
Documentation = "https://github.com/SalindaHulangamuwa/facebook-mcp#readme"
Issues = "https://github.com/SalindaHulangamuwa/facebook-mcp/issues"
Changelog = "https://github.com/SalindaHulangamuwa/facebook-mcp/blob/main/CHANGELOG.md"

[project.scripts]
facebook-mcp = "facebook_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/facebook_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/facebook_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["facebook_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "N", "PL", "T20", "S"]
ignore = ["PLR0913"]  # tool signatures legitimately mirror Graph API parameters

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "S105", "S106", "S107"]

[tool.ruff.lint.mccabe]
# McCabe counts each nested tool definition in a `register()` function as a branch.
max-complexity = 8
